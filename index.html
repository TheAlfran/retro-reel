<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#071b2d" />
    <meta name="description" content="Retro Reel — a tiny Phaser 3 fishing adventure." />
    <title>Retro Reel</title>
  </head>
  <body>
    <main>
      <div class="game-shell">
        <div class="brand" aria-hidden="true">
          <span class="brand-mark">RR</span>
          <span>RETRO REEL</span>
        </div>
        <section id="captain-setup" class="captain-setup" aria-labelledby="setup-title">
          <div class="setup-card">
            <p class="setup-kicker">NEW VOYAGE</p>
            <h1 id="setup-title">CREATE YOUR CAPTAIN</h1>
            <p class="setup-copy">Name the fisher taking the helm.</p>
            <form id="captain-form" novalidate>
              <label for="captain-name">CAPTAIN NAME</label>
              <input id="captain-name" name="captainName" type="text" minlength="2" maxlength="16" autocomplete="nickname" placeholder="Enter a name" required />
              <p id="setup-error" class="setup-error" aria-live="polite"></p>
              <button id="captain-submit" type="submit">CAST OFF</button>
            </form>
          </div>
        </section>
        <div id="game" aria-label="Retro Reel fishing game"></div>
        <p class="fallback">Use ← → or A D to sail · Space to cast and stop the reel</p>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
